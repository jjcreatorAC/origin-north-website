# The code lives on the "source" branch. Whenever it changes, this builds the
# site and commits the finished files to "main", so main is always the website
# itself, ready for Hostinger (hPanel: Advanced, Git) to publish.
name: Build the website into main

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Main keeps a running history, so Hostinger can always pull it.
      - name: Commit the build to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin main
          git worktree add --detach ../site FETCH_HEAD
          git -C ../site rm -rq --ignore-unmatch .
          cp -a dist/. ../site/
          git -C ../site add -A
          if git -C ../site diff --cached --quiet; then
            echo "The built site has not changed."
          else
            git -C ../site commit -q -m "Build of ${GITHUB_SHA::7}"
            git -C ../site push origin HEAD:main
          fi
